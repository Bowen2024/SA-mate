<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="490" viewBox="0 0 1480 490" role="img" aria-labelledby="title desc">
  <title id="title">SA-mate 当前架构：用户是左上方的项目入口</title>
  <desc id="desc">左上方蓝色用户入口提供项目、目标、材料与操作意图。主流程从左向右依次连接用户、Agent 执行环境、当前 Agent、MCP 文件工具与业务项目目录，请求和结果双向流动。下方角色主文档及 Develop Helper 方法以虚线支持当前 Agent。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="support-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#a16207" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1480" height="490" rx="18" fill="#ffffff"/>

  <g fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M270 112 C291 112 289 147 308 147"/>
    <path d="M552 147 H598"/>
    <path d="M832 147 H878"/>
    <path d="M1132 147 H1178"/>
  </g>
  <g fill="none" stroke="#a16207" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#support-arrow)">
    <path d="M580 328 C580 272 670 272 670 211"/>
    <path d="M1005 328 C1005 268 760 268 760 211"/>
  </g>

  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <g id="user-entry">
      <rect x="28" y="35" width="240" height="154" rx="16" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
      <rect x="48" y="49" width="100" height="26" rx="13" fill="#dbeafe"/>
      <text x="98" y="68" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="700">项目入口</text>
      <text x="48" y="111" fill="#ffffff" font-size="29" font-weight="700">用户</text>
      <text x="48" y="142" fill="#ffffff" font-size="21">项目、目标、材料</text>
      <text x="48" y="171" fill="#ffffff" font-size="21">与操作意图</text>
    </g>

    <g id="execution-environment">
      <rect x="310" y="85" width="240" height="124" rx="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="330" y="119" fill="#0f172a" font-size="22" font-weight="650">Agent 执行环境</text>
      <text x="330" y="153" fill="#334155" font-size="20">对话、文件读取</text>
      <text x="330" y="183" fill="#334155" font-size="20">与工具连接</text>
    </g>

    <g id="current-agent">
      <rect x="600" y="85" width="230" height="124" rx="13" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="620" y="119" fill="#1e3a8a" font-size="22" font-weight="650">当前 Agent</text>
      <text x="620" y="153" fill="#334155" font-size="20">选择角色、讨论</text>
      <text x="620" y="183" fill="#334155" font-size="20">形成候选</text>
    </g>

    <g id="mcp-tools">
      <rect x="880" y="85" width="250" height="124" rx="13" fill="#f0fdf4" stroke="#86b899" stroke-width="1.5"/>
      <text x="900" y="119" fill="#14532d" font-size="22" font-weight="650">MCP 文件工具</text>
      <text x="900" y="153" fill="#334155" font-size="20">项目、版本、保存</text>
      <text x="900" y="183" fill="#334155" font-size="20">历史与恢复</text>
    </g>

    <g id="project-artifacts">
      <rect x="1180" y="85" width="265" height="124" rx="13" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="1200" y="119" fill="#0f172a" font-size="22" font-weight="650">业务项目目录</text>
      <text x="1200" y="153" fill="#334155" font-size="20">需求、PRD、方案</text>
      <text x="1200" y="183" fill="#334155" font-size="20">与 UI 成果</text>
    </g>

    <g id="role-documents">
      <rect x="430" y="330" width="300" height="95" rx="13" fill="#fffbeb" stroke="#d6b76c" stroke-width="1.5"/>
      <text x="452" y="365" fill="#713f12" font-size="22" font-weight="650">角色主文档</text>
      <text x="452" y="401" fill="#57534e" font-size="20">需求／方案／UI</text>
    </g>

    <g id="sdd-methods">
      <rect x="825" y="330" width="360" height="95" rx="13" fill="#fffbeb" stroke="#d6b76c" stroke-width="1.5"/>
      <text x="847" y="365" fill="#713f12" font-size="22" font-weight="650">Develop Helper</text>
      <text x="847" y="401" fill="#57534e" font-size="20">按需采用 SDD 方法</text>
    </g>

    <g fill="#713f12" font-size="16" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
      <text x="487" y="279">职责与工作约定</text>
      <text x="882" y="279">分析与设计方法</text>
    </g>

    <text x="28" y="466" fill="#64748b" font-size="17">实线：请求与结果双向流动</text>
    <text x="360" y="466" fill="#64748b" font-size="17">虚线：角色规则与方法支持</text>
  </g>
</svg>
